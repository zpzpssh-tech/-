<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>올투게더나우 통합관리</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --line: #e4e7ec; --line-2: #eef0f3;
  --text: #191c21; --text-2: #5b6370; --text-3: #8a919c;
  --side: #121a2b; --side-text: #c4cad6; --side-hover: #1c2740; --side-active: #25324f;
  --accent: #2563eb; --accent-soft: #e8efff; --accent-text: #1d4fc4;
  --good: #0e7a2f; --good-soft: #e3f4e8; --warn: #a76100; --warn-soft: #fff3dc;
  --bad: #c62828; --bad-soft: #fde8e8; --info-soft: #eef2f7;
  --series-1: #257de0; --series-2: #f47230; --series-3: #00b894; --series-4: #f2a600; --series-5: #ee7fac;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111317; --surface: #1a1d23; --surface-2: #20242b; --line: #2e333c; --line-2: #262a31;
    --text: #eceef2; --text-2: #a7aeba; --text-3: #7c8491;
    --side: #0b0f18; --side-text: #b4bccb; --side-hover: #151c2c; --side-active: #1e2a44;
    --accent: #5b8def; --accent-soft: #1d2a47; --accent-text: #9dbbff;
    --good: #4cc26e; --good-soft: #15301f; --warn: #f0b04a; --warn-soft: #3a2a10;
    --bad: #f07070; --bad-soft: #3d1a1a; --info-soft: #232a35;
    --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; --series-4: #d28e05; --series-5: #e24d8b;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111317; --surface: #1a1d23; --surface-2: #20242b; --line: #2e333c; --line-2: #262a31;
  --text: #eceef2; --text-2: #a7aeba; --text-3: #7c8491;
  --side: #0b0f18; --side-text: #b4bccb; --side-hover: #151c2c; --side-active: #1e2a44;
  --accent: #5b8def; --accent-soft: #1d2a47; --accent-text: #9dbbff;
  --good: #4cc26e; --good-soft: #15301f; --warn: #f0b04a; --warn-soft: #3a2a10;
  --bad: #f07070; --bad-soft: #3d1a1a; --info-soft: #232a35;
  --series-1: #338ced; --series-2: #e76624; --series-3: #00a888; --series-4: #d28e05; --series-5: #e24d8b;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
/* 사이드바 */
.side { background: var(--side); color: var(--side-text); padding: 20px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { padding: 4px 10px 20px; }
.brand b { display: block; color: #fff; font-size: 16px; letter-spacing: -.2px; }
.brand span { font-size: 12px; color: #7f8aa3; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-text); text-decoration: none; cursor: pointer; margin-bottom: 2px; }
.nav a:hover { background: var(--side-hover); }
.nav a.on { background: var(--side-active); color: #fff; }
.nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .badge { margin-left: auto; background: #e5484d; color: #fff; font-size: 11px; padding: 0 7px; border-radius: 10px; line-height: 18px; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: #7f8aa3; }
.side-foot .mode { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #3a2f12; color: #f3c35b; font-weight: 600; margin-bottom: 6px; }
.side-foot .mode.live { background: #12321e; color: #6fd68f; }
/* 본문 */
.main { padding: 24px 28px 60px; min-width: 0; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.head h1 { font-size: 22px; margin: 0; letter-spacing: -.4px; }
.head .sub { color: var(--text-3); font-size: 13px; }
.head .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 15px; margin: 0; padding: 14px 16px 0; display: flex; align-items: center; gap: 8px; }
.card h2 .hint { font-weight: 400; color: var(--text-3); font-size: 12px; }
.card .body { padding: 12px 16px 16px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.kpi { padding: 14px 16px; cursor: pointer; }
.kpi .label { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 14px; font-weight: 500; color: var(--text-2); margin-left: 2px; }
.kpi .foot { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.kpi.alert .val { color: var(--bad); }
.two { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
/* 표 */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }
tr.sel td { background: var(--accent-soft) !important; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.ell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 20px; }
.st-신규 { background: var(--accent-soft); color: var(--accent-text); }
.st-발주확인 { background: var(--warn-soft); color: var(--warn); }
.st-송장입력 { background: #efe7ff; color: #5b3cc4; }
.st-출고완료 { background: var(--good-soft); color: var(--good); }
.st-위탁배송 { background: var(--info-soft); color: var(--text-2); }
.st-취소 { background: var(--bad-soft); color: var(--bad); }
:root[data-theme="dark"] .st-송장입력 { background: #2b2246; color: #b9a6ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-송장입력 { background: #2b2246; color: #b9a6ff; } }
.tag { display: inline-block; padding: 0 6px; border-radius: 5px; font-size: 11.5px; background: var(--info-soft); color: var(--text-2); white-space: nowrap; line-height: 19px; }
.tag.acc { font-weight: 600; }
.sku { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-2); margin: 2px 4px 0 0; line-height: 18px; white-space: nowrap; }
.unmapped { color: var(--bad); font-weight: 600; font-size: 12px; cursor: pointer; }
.unmapped:hover { text-decoration: underline; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
/* 필터 */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.filters input, .filters select, .field input, .field select, .field textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; outline: none; }
.filters input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tabs { display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.tabs .n { font-size: 12px; color: var(--text-3); margin-left: 3px; }
.actionbar { display: flex; gap: 6px; align-items: center; padding: 10px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.actionbar .cnt { font-weight: 600; color: var(--accent-text); margin-right: 6px; }
.empty { text-align: center; color: var(--text-3); padding: 40px 10px; }
/* 모달 */
.overlay { position: fixed; inset: 0; background: rgba(10,14,22,.45); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal.wide { max-width: 760px; }
.modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.modal header h3 { margin: 0; font-size: 16px; }
.modal header .x { margin-left: auto; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--text-3); line-height: 1; }
.modal .content { padding: 16px 20px; }
.modal footer { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13px; color: var(--text-2); font-weight: 600; }
.field .help { font-size: 12px; color: var(--text-3); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
textarea { width: 100%; min-height: 160px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace !important; font-size: 13px !important; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
.note b { color: var(--text); }
/* 토스트 */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 90vw; }
.toast.err { background: #b42318; }
/* 차트 */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
.chart .axis text { fill: var(--text-3); font-size: 11px; }
.chart .grid line { stroke: var(--line-2); }
.chart .bar rect { stroke: var(--surface); stroke-width: 2px; }
.chart .hit { fill: transparent; cursor: default; }
.chart g.dim rect, .chart g.dim path { opacity: .45; }
.chart .bar { pointer-events: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.12); min-width: 150px; z-index: 5; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }
/* 재고 */
.cell-stock { font-variant-numeric: tabular-nums; }
.cell-stock .sub { display: block; font-size: 11px; color: var(--text-3); }
.cell-stock.zero { color: var(--text-3); }
.cell-stock.short { color: var(--bad); font-weight: 600; }
.pill-days { font-size: 12px; font-weight: 600; }
.pill-days.bad { color: var(--bad); } .pill-days.warn { color: var(--warn); } .pill-days.ok { color: var(--good); }
.statusline { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.statusline.bad { color: var(--bad); } .statusline.warn { color: var(--warn); } .statusline.ok { color: var(--good); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 40; box-shadow: -10px 0 30px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.drawer header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.drawer header h3 { margin: 0; font-size: 16px; }
.drawer .content { padding: 12px 20px; overflow-y: auto; flex: 1; }
/* 설정 */
.acc-card { padding: 16px; }
.acc-card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.acc-card .top b { font-size: 15px; }
.conn { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
.conn.on { background: var(--good-soft); color: var(--good); }
.conn.off { background: var(--info-soft); color: var(--text-3); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { width: 36px; height: 20px; appearance: none; background: var(--line); border-radius: 20px; position: relative; cursor: pointer; transition: .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 18px; }
.log { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 10px; }
.log .t { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.log.error { color: var(--bad); }
.list-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.list-row:last-child { border-bottom: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.maprow { display: grid; grid-template-columns: 1fr 90px 36px; gap: 8px; margin-bottom: 8px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { min-width: 0; position: static; height: auto; flex-direction: row; align-items: center; padding: 8px; overflow-x: auto; }
  .brand, .side-foot { display: none; }
  .nav { display: flex; gap: 2px; }
  .nav a { white-space: nowrap; }
  .main { padding: 16px; }
  .row2, .row3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>올투게더나우</b><span>통합 주문·재고 관리</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>

<script>
// ───────────────────────── 공통 도구 ─────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => (Math.round(n || 0)).toLocaleString("ko-KR");
const num = n => (n || 0).toLocaleString("ko-KR");
const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  orders: '<path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  stock: '<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8M7 17h10"/>',
  map: '<path d="M7 7h10M7 12h4M14 12h3M7 17h10"/><rect x="3" y="3" width="18" height="18" rx="2"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
const svgIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `오류 (${r.status})`);
  return j;
}
function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 5000 : 2800);
}
async function run(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
}
function modal(title, html, { wide = false, onOpen } = {}) {
  const layer = $("#layer");
  layer.innerHTML = `<div class="overlay"><div class="modal ${wide ? "wide" : ""}"><header><h3>${title}</h3><button class="x" data-close>×</button></header>${html}</div></div>`;
  const ov = $(".overlay", layer);
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(); });
  $$("[data-close]", ov).forEach(b => b.onclick = closeModal);
  onOpen && onOpen(ov);
  const first = $("input, select, textarea", ov); first && first.focus();
  return ov;
}
function closeModal() { $("#layer").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeDrawer(); } });

// ───────────────────────── 상태 ─────────────────────────
const S = { page: "home", meta: null, orders: [], sel: new Set(), of: { status: "처리대기" }, inv: null, invFilter: { q: "", cat: "" } };
const ACC_COLOR = { NAV: "var(--series-1)", CPG: "var(--series-2)", HCK: "var(--series-3)", YCU: "var(--series-4)", RKT: "var(--series-5)" };
const accName = c => (S.meta.accounts.find(a => a.code === c) || {}).name || c;
const accShort = c => ({ NAV: "네이버", CPG: "쿠팡·올투", HCK: "휴책", YCU: "유큐어", RKT: "로켓배송" }[c] || c);
const whName = c => (S.meta.warehouses.find(w => w.code === c) || {}).name || c;
const skuName = c => (S.meta.skus.find(s => s.code === c) || {}).name || c;
const accTag = c => `<span class="tag acc"><span class="sw" style="background:${ACC_COLOR[c] || "var(--text-3)"}"></span>${esc(accShort(c))}</span>`;

const PAGES = [
  ["home", "홈", "home"], ["orders", "주문", "orders"], ["stock", "재고", "stock"],
  ["map", "상품 매핑", "map"], ["settings", "설정", "set"],
];
function renderNav(badges = {}) {
  $("#nav").innerHTML = PAGES.map(([k, label, ic]) =>
    `<a data-p="${k}" class="${S.page === k ? "on" : ""}">${svgIcon(ic)}${label}${badges[k] ? `<span class="badge">${badges[k]}</span>` : ""}</a>`).join("");
  $$("#nav a").forEach(a => a.onclick = () => go(a.dataset.p));

function drawChart(el, daily) {
  const accs = S.meta.accounts.map(a => a.code);
  const days = [];
  const base = new Date(); base.setHours(12);
  for (let i = 13; i >= 0; i--) { const d = new Date(base); d.setDate(d.getDate() - i); days.push(d.toISOString().slice(0, 10)); }
  // toISOString은 UTC 기준이라 한국 날짜와 하루 어긋날 수 있어 로컬 날짜로 다시 만듭니다
  for (let i = 0; i < days.length; i++) { const d = new Date(base); d.setDate(d.getDate() - (13 - i)); days[i] = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  const val = {}; daily.forEach(r => { val[r.d + r.account] = r.c; });
  const tot = days.map(d => accs.reduce((a, c) => a + (val[d + c] || 0), 0));
  const max = Math.max(10, ...tot);
  const step = max > 80 ? 20 : max > 40 ? 10 : 5;
  const top = Math.ceil(max / step) * step;
  const W = 640, H = 220, L = 32, B = 22, T = 8, R = 4;
  const bw = (W - L - R) / days.length, barW = Math.min(26, bw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '<g class="grid axis">';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += "</g>";
  let bars = "", hits = "";
  days.forEach((d, i) => {
    const x = L + i * bw + (bw - barW) / 2;
    let acc = 0, segs = "";
    const live = accs.filter(c => val[d + c]);
    live.forEach((c, j) => {
      const v = val[d + c]; const y0 = y(acc), y1 = y(acc + v); acc += v;
      const h = Math.max(0, y0 - y1);
      if (j === live.length - 1) { // 맨 위 조각만 둥글게
        const r = Math.min(4, h, barW / 2);
        segs += `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + barW - r} Q${x + barW},${y1} ${x + barW},${y1 + r} V${y0} Z" fill="${ACC_COLOR[c]}" stroke="var(--surface)" stroke-width="2"/>`;
      } else segs += `<rect x="${x}" y="${y1}" width="${barW}" height="${h}" fill="${ACC_COLOR[c]}"/>`;
    });
    const lab = (i % 2 === (days.length - 1) % 2) ? `<text x="${x + barW / 2}" y="${H - 6}" text-anchor="middle">${+d.slice(5, 7)}/${+d.slice(8)}</text>` : "";
    bars += `<g class="bar" data-i="${i}">${segs}</g><g class="axis">${lab}</g>`;
    hits += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
  });
  el.innerHTML = `<div class="legend">${accs.map(c => `<span><span class="sw" style="background:${ACC_COLOR[c]}"></span>${esc(accShort(c))}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 14일 계정별 주문 건수">${g}${bars}${hits}</svg><div class="tip" hidden></div>`;
  const tip = $(".tip", el), svg = $("svg", el);
  $$(".hit", el).forEach(h => {
    h.onmousemove = e => {
      const i = +h.dataset.i, d = days[i];
      $$("g.bar", el).forEach(b => b.classList.toggle("dim", b.dataset.i != i));
      tip.innerHTML = `<b>${+d.slice(5, 7)}월 ${+d.slice(8)}일 · ${tot[i]}건</b>` + accs.slice().reverse().map(c => `<div><span><span class="sw" style="background:${ACC_COLOR[c]}"></span>${esc(accShort(c))}</span><span>${val[d + c] || 0}</span></div>`).join("");
      tip.hidden = false;
      const rc = el.getBoundingClientRect();
      let left = e.clientX - rc.left + 14; if (left + 170 > rc.width) left = e.clientX - rc.left - 180;
      tip.style.left = left + "px"; tip.style.top = (e.clientY - rc.top - 20) + "px";
    };
    h.onmouseleave = () => { tip.hidden = true; $$("g.bar", el).forEach(b => b.classList.remove("dim")); };
  });
}

function guessQty(opt) {
  // 옵션명에서 개수를 추측합니다: "2개", "양쪽", "2p" → 2

  const m = s.match(/(\d+)\s*(개|p|P|매|세트)/); return m ? +m[1] : 1;
}

  modal(isNew ? "SKU 추가" : "SKU 수정", `<div class="content">
    <div class="note"><b>SKU</b>는 창고에 실제로 쌓여 있는 '낱개 실물 상품' 단위입니다. 사이즈·색상이 다르면 SKU도 다릅니다.</div>
    <div class="row2"><div class="field"><label>SKU 코드</label><input id="kCode" value="${esc(s.code || "")}" ${isNew ? "" : "disabled"} placeholder="예: KNEE-ST-BK"></div>
    <div class="field"><label>분류</label><input id="kCat" value="${esc(s.category || "")}" placeholder="무릎·손목·허리…"></div></div>
    <div class="field"><label>상품명</label><input id="kName" value="${esc(s.name || "")}"></div>
    <div class="row2"><div class="field"><label>안전재고 (전체 가용 기준)</label><input id="kSafe" type="number" min="0" value="${s.safety || 0}"><span class="help">이 아래로 내려가면 '부족' 경고</span></div>
    <div class="field"><label>원가 (원)</label><input id="kCost" type="number" min="0" value="${s.cost || 0}"></div></div>
    <div class="field"><label>메모</label><input id="kMemo" value="${esc(s.memo || "")}" placeholder="공장, 리드타임 등"></div>
    <label class="switch"><input type="checkbox" id="kAct" ${s.active === 0 ? "" : "checked"}> 사용 중</label>
  </div><footer><button class="btn" data-close>닫기</button><button class="btn primary" id="kSave">저장</button></footer>`, {
    onOpen: ov => {
      $("#kSave", ov).onclick = async () => {
        await run(() => api("/api/skus", { code: $("#kCode", ov).value, name: $("#kName", ov).value, category: $("#kCat", ov).value, safety: +$("#kSafe", ov).value, cost: +$("#kCost", ov).value, memo: $("#kMemo", ov).value, active: $("#kAct", ov).checked ? 1 : 0 }), "저장했습니다");
        closeModal(); render();
      };
    }
  });
}

// ───────────────────────── 설정 ─────────────────────────
async function pageSettings() {
  const st = await api("/api/settings");
  const logs = await api("/api/logs");
  const accFields = a => a.channel === "네이버"
    ? [["client_id", "애플리케이션 ID"], ["client_secret", "애플리케이션 시크릿"]]
    : [["vendor_id", "업체코드 (A로 시작)"], ["access_key", "Access Key"], ["secret_key", "Secret Key"]];
  $("#main").innerHTML = `<div class="head"><h1>설정</h1><span class="sub">쇼핑몰 연결 · 수집 주기</span></div>
  <div class="grid two">
    <div>
      <div class="card" style="margin-bottom:14px"><h2>기본 설정</h2><div class="body">
        <label class="switch" style="margin-bottom:6px"><input type="checkbox" id="cDemo" ${st["데모모드"] ? "checked" : ""}> <b>데모 모드</b></label>
        <div class="help muted small" style="margin-bottom:14px">켜져 있으면 가짜 주문으로 연습합니다. 실제 API 키를 넣은 뒤 끄면 진짜 주문을 가져옵니다.</div>
        <div class="row3"><div class="field"><label>자동 수집 (분)</label><input id="cMin" type="number" min="0" value="${st["자동수집_분"]}"><span class="help">0이면 끔</span></div>
        <div class="field"><label>첫 수집 기간 (일)</label><input id="cDays" type="number" min="1" max="30" value="${st["첫수집_일수"]}"></div>
        <div class="field"><label>기본 택배사</label><select id="cCourier">${S.meta.couriers.map(c => `<option ${st["기본택배사"] === c ? "selected" : ""}>${c}</option>`).join("")}</select></div></div>
        <button class="btn primary" id="cSave">저장</button>
      </div></div>
      ${S.meta.accounts.map(a => {
        const c = st["계정"][a.code];
        if (a.code === "RKT" || !c) return `<div class="card acc-card" style="margin-bottom:14px"><div class="top">${accTag(a.code)}<b>${esc(a.name)}</b><span class="conn off">직접 등록</span></div>
          <div class="small muted">로켓배송(직매입) 발주는 쿠팡 오픈API로 받을 수 없어서, <b>주문 → 주문 직접 등록</b>으로 발주를 넣고 출고완료하면 본사창고 재고에서 빠집니다.</div></div>`;
        return `<div class="card acc-card" style="margin-bottom:14px" data-acc="${a.code}"><div class="top">${accTag(a.code)}<b>${esc(a.name)}</b><span class="small muted">${esc(a.ship_type)}</span><span class="conn ${c._connected ? "on" : "off"}" style="margin-left:auto">${c._connected ? "키 입력됨" : "미연결"}</span></div>
          ${accFields(a).map(([k, l]) => `<div class="field"><label>${l}</label><input data-k="${k}" value="${esc(c[k] || "")}" autocomplete="off" spellcheck="false"></div>`).join("")}
          ${a.channel === "쿠팡" ? `<div style="display:flex;gap:16px;margin-bottom:12px"><label class="switch small"><input type="checkbox" data-k="판매자배송" ${c["판매자배송"] ?? a.ship_type === "판매자배송" ? "checked" : ""}> 판매자배송 주문 수집</label><label class="switch small"><input type="checkbox" data-k="로켓그로스" ${c["로켓그로스"] ?? a.ship_type === "로켓그로스" ? "checked" : ""}> 로켓그로스 주문 수집</label></div>` : `<div class="help small muted" style="margin-bottom:12px">N배송(도착보장) 주문은 N배송창고에서, 그 외는 본사창고에서 재고가 빠집니다.</div>`}
          <div style="display:flex;gap:8px"><button class="btn sm primary" data-save>저장</button><button class="btn sm" data-test>연결 테스트</button></div></div>`;
      }).join("")}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><h2>API 키 받는 곳</h2><div class="body small">
        <div class="list-row"><div class="grow"><b>네이버 커머스API</b><br><span class="muted">커머스API센터(apicenter.commerce.naver.com) → 애플리케이션 등록 → ID·시크릿 복사. 내 컴퓨터 IP 등록이 필요할 수 있습니다.</span></div></div>
        <div class="list-row"><div class="grow"><b>쿠팡 WING 오픈API</b><br><span class="muted">WING → 판매자정보 → 추가판매정보 → OPEN API 키 발급. 계정(올투게더나우·휴책·유큐어)마다 따로 받습니다.</span></div></div>
        <div class="note" style="margin:10px 0 0">🔒 키는 이 컴퓨터의 <b>oms/설정/계정.json</b>에만 저장되고, 화면에는 끝 4자리만 보입니다. 채팅·메신저에 붙여넣지 마세요.</div>
      </div></div>
      <div class="card" style="margin-bottom:14px"><h2>데모 데이터</h2><div class="body small"><div class="muted" style="margin-bottom:10px">연습하다 꼬였으면 데모 데이터를 처음 상태로 되돌립니다. (실제 연결 후에는 쓰지 마세요 — 모든 주문·재고가 지워집니다)</div>
        <button class="btn danger" id="cReset">데모 데이터 초기화</button></div></div>
      <div class="card"><h2>작업 기록</h2><div class="body" style="max-height:420px;overflow:auto">${logs.map(l => `<div class="log ${l.level}"><span class="t">${esc(l.ts.slice(5))}</span><span>${esc(l.text)}</span></div>`).join("") || '<div class="muted">기록이 없습니다</div>'}</div></div>
    </div>
  </div>`;
  $("#cSave").onclick = async () => {
    await run(() => api("/api/settings", { "데모모드": $("#cDemo").checked, "자동수집_분": +$("#cMin").value, "첫수집_일수": +$("#cDays").value, "기본택배사": $("#cCourier").value }), "저장했습니다");
    render();
  };
  $$("[data-acc]").forEach(card => {
    const acc = card.dataset.acc;
    const collect = () => { const o = {}; $$("[data-k]", card).forEach(i => o[i.dataset.k] = i.type === "checkbox" ? i.checked : i.value); return o; };
    $("[data-save]", card).onclick = async () => { await run(() => api("/api/settings", { "계정": { [acc]: collect() } }), "저장했습니다"); render(); };
    $("[data-test]", card).onclick = async () => {
      await api("/api/settings", { "계정": { [acc]: collect() } });
      const r = await run(() => api("/api/test", { account: acc }));
      toast((r.ok ? "✓ " : "✗ ") + r.msg, !r.ok);
    };
  });
  $("#cReset").onclick = async () => {
    if (!confirm("데모 데이터를 처음 상태로 되돌릴까요? 지금까지의 주문·재고 기록이 모두 지워집니다.")) return;
    await run(() => api("/api/demo/reset", {}), "데모 데이터를 다시 만들었습니다");
    go("home");
  };
}

// ───────────────────────── 시작 ─────────────────────────
S.page = (location.hash || "#home").slice(1);
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (p && p !== S.page) go(p); });
render().catch(e => { $("#main").innerHTML = `<div class="empty">프로그램에 연결하지 못했습니다.<br>터미널에서 <b>python3 oms/app.py</b> 가 켜져 있는지 확인해 주세요.<br><span class="small">${esc(e.message)}</span></div>`; });
setInterval(() => { if (!$("#layer").innerHTML && document.visibilityState === "visible" && S.page === "home") render(); }, 60000);
</script>
</body>
</html>
